name: CI

on:
  push:
    branches: [v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Version pins (D12)
        run: npm run pins

      - name: Build
        run: npm run build

      # Regenerates from the vendored spec, offline, and diffs against the
      # committed types: catches hand edits and an uncommitted regeneration.
      - name: Contracts — types match vendored spec
        run: npm run gen:contracts:check
